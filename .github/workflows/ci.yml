name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A cold kernel build is slow enough that being able to trigger CI on demand
  # -- after a cache eviction, or to re-run without an empty commit -- is worth
  # the one line.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read pinned toolchain versions
        id: pins
        run: |
          set -a; . native/toolchain.env; set +a
          echo "emsdk=$WEBCAD_EMSDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "occt=$WEBCAD_OCCT_VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # An OCCT build from scratch is slow enough that an uncached step would
      # discourage running it, so the install tree is cached on the pinned
      # versions. The facade relinks in seconds on a cache hit.
      #
      # The configure line is part of the key, not just the versions. Which
      # toolkits get built, and which flags they are built with, live in
      # build-kernel.sh -- the same OCCT version configured two ways produces
      # two different install trees. Keying on the version alone let a tree
      # built without TKDESTEP satisfy a build that needs it, so the key hashes
      # the script that decides.
      #
      # Restore and save are separate steps because actions/cache skips its own
      # save when the job fails -- which is exactly when a 40-minute OCCT build
      # most needs to be reusable. Saving immediately after the build means a
      # failure anywhere downstream costs one run, not one run per attempt.
      - name: Cache OCCT install tree
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: native/build/occt-${{ steps.pins.outputs.occt }}-install
          key: occt-${{ steps.pins.outputs.occt }}-emsdk-${{ steps.pins.outputs.emsdk }}-${{ runner.os }}-${{ hashFiles('scripts/build-kernel.sh') }}

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: third_party/emsdk
          key: emsdk-${{ steps.pins.outputs.emsdk }}-${{ runner.os }}

      - name: Install Emscripten
        run: bash scripts/install-emsdk.sh

      - name: Fetch OCCT source
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-occt.sh

      - name: Build OCCT
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-kernel.sh --occt-only

      - name: Save OCCT install tree
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/build/occt-${{ steps.pins.outputs.occt }}-install
          key: occt-${{ steps.pins.outputs.occt }}-emsdk-${{ steps.pins.outputs.emsdk }}-${{ runner.os }}-${{ hashFiles('scripts/build-kernel.sh') }}

      - name: Build kernel facade
        run: bash scripts/build-kernel.sh --facade-only

      # Unconditional, unlike the OCCT source fetch above. The STEP fixtures are
      # OCCT test data inside that gitignored source tree, so an install-tree
      # cache hit skipped the clone and left the STEP suites with nothing to
      # read: they skipped themselves and the run stayed green having exercised
      # only the leg where we read a file we wrote ourselves. Two files, ~1.9 MB.
      - name: Fetch STEP fixtures
        run: bash scripts/fetch-step-fixtures.sh

      - name: Typecheck
        run: npm run typecheck

      # Kernel tests skip themselves when the artifact is missing, so this step
      # failing means a real regression rather than a missing build.
      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      # Exercises the render path, backend selection, GPU upload, and picking -
      # none of which the node tests can reach. Ubuntu runners ship Chrome, and
      # playwright-core drives it rather than downloading a browser.
      - name: Verify in browser (WebGPU where available)
        run: npm run verify:browser

      - name: Verify in browser (WebGL2 fallback)
        run: npm run verify:browser:webgl

      - name: Upload payload measurements
        uses: actions/upload-artifact@v4
        with:
          name: measurements
          path: measurements/
